site_name: 观澜书库
theme:
  name: material
  language: zh
  font: false
  palette:
    scheme: default
    primary: white
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
markdown_extensions:
  - attr_list
  - md_in_html
extra_css:
  - stylesheets/extra.css
